<div class="movie">
	<app-header (toggleSidebar)="toggleSidebar()"></app-header>
	<main>
		<div class=" movie__container">
			<div class="movie__wrapper">
				<div class="movie__sidebar" [class]="sidebarVisible?'movie__sidebar-open':'movie__sidebar-close'">
					<app-navbar [isOpen]="sidebarVisible" (closeSideBar)="toggleSidebar()"></app-navbar>
				</div>
				<div class="movie__content">
					<router-outlet></router-outlet>
				</div>
			</div>
		</div>
	</main>
</div>
